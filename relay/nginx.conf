events {}
http {
    # Docker DNS is resolved for each new connection after relay recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    server {
        listen 8080;
        set $backend http://relay:4113;
        location = /ws { return 404; }
        location = /api/positions/closed { return 404; }
        location / { proxy_pass $backend; }
    }
    server {
        listen 8081;
        set $backend http://relay:4113;
        location = /ws { proxy_pass $backend; }
        location = /api/positions/closed { proxy_pass $backend; }
        location = /health { proxy_pass $backend; }
        location / { return 404; }
    }
}
