name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      - run: shellcheck -e SC1091 scripts/*.sh
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Verify separate admin and client ports
        run: |
          sudo install -d -m 0700 -o 10001 -g 10001 state
          docker compose run --rm --no-deps relay python -m relay.setup
          docker compose up -d --wait --wait-timeout 90
          python tests/gateway_smoke.py
      - if: always()
        run: docker compose down
