name: esc-gold-server
services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 256m
    pids_limit: 96
    volumes: ['./state:/data']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4113/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-${PORT:-4113}}:8080'
      - '${BIND_ADDRESS:-127.0.0.1}:${WS_PORT:-4114}:8081'
    volumes: ['./relay/nginx.conf:/etc/nginx/nginx.conf:ro']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/health']
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
