name: esc-gold-server
services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 256m
    pids_limit: 96
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${PORT:-4113}:4113']
    volumes: ['./state:/data']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4113/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
